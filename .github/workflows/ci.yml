name: CI

on:
  push:
    branches: [main]
  pull_request:

# No game data, no Unity, and no vendored tools are needed for these checks — they run
# entirely on the first-party Python. (Unity builds need a licensed runner and are not in CI.)
jobs:
  python:
    name: lint · type · compile · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment (deps + dev tools)
        run: uv sync --group dev

      - name: Ruff format (check)
        run: uv run ruff format --check tools/

      - name: Ruff lint
        run: uv run ruff check tools/

      - name: Type check (advisory)
        run: uv run ty check tools/
        continue-on-error: true

      - name: Byte-compile
        run: uv run python -m compileall -q tools/

      - name: Smoke test (da paths resolves)
        run: uv run python tools/da.py paths
